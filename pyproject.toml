[project]
name = "ai-daily-paper"
dynamic = ["version"]
description = "AI RSS daily report generation pipeline"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "feedparser>=6.0.11",
  "PyYAML>=6.0.1",
  "beautifulsoup4>=4.12.3",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# 版本号唯一来源：仓库根目录 VERSION
[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = '(?P<version>\d+\.\d+\.\d+)'

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
