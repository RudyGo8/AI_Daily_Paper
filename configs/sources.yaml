    source_weight: 4
  # GitHub 搜索：按 Topic 抓取热门项目，搜索词见下方 queries
  - name: GitHub
    type: github
    topic: [github]
    source_weight: 4
    per_page: 30
    enrich_limit: 20
    queries:
      github:
        [
          "topic:ai-agent stars:>20",
          "topic:rag stars:>20",
          "topic:mcp stars:>20",
          "topic:llm stars:>20",
        ]

  # Anthropic 官方新闻：站点无可用 RSS，改抓网页列表
  - name: Anthropic News
    type: webpage
    topic: [ai, agent]
    source_weight: 5
    url: https://www.anthropic.com/news
    timezone: America/Los_Angeles
    date_format: "%b %d, %Y"
    max_items: 30
    max_detail_items: 10
    selectors:
      item: 'li[data-listing-row]'
      link: 'a[href^="/news/"]:has(h3)'
      title: 'h3'
      date: "time"
    detail_selectors:
      content: 'article'
      date: "article time"
