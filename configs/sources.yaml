  - name: 青岛人社通知公告
    type: webpage
    topic: [qingdao_policy]
    source_weight: 5
    url: https://hrss.qingdao.gov.cn/zxzx_47/tzgg_47/
    timezone: Asia/Shanghai
    max_items: 30
    max_detail_items: 10
    date_regex: '(\d{4}-\d{2}-\d{2})'
    selectors:
      item: '.pc .lmlbc li'
      link: 'p a'
      title: 'p a'
      date: 'em'
    detail_selectors:
      content: '.pc .trs_editor_view'
      date: '.pc .wencon > p span'
  - name: 青岛住建规范性文件
    type: webpage
    topic: [qingdao_policy]
    source_weight: 5
    url: https://sjw.qingdao.gov.cn/cxjsj11/cxjsj75/index.shtml
    timezone: Asia/Shanghai
    prefer_https: true
    max_items: 30
    max_detail_items: 10
    date_regex: '(\d{4}-\d{2}-\d{2})'
    selectors:
      item: '.ul_list_list li'
      link: 'a'
      title: '.div_list_li_width_left'
      date: '.div_list_li_width_right'
    detail_selectors:
      content: '.trs_editor_view'
      date: '.time'
  - name: Anthropic News
    type: webpage
    topic: [ai, agent, industry]
    source_weight: 5
    url: https://www.anthropic.com/news
    timezone: America/Los_Angeles
    date_format: '%b %d, %Y'
    max_items: 30
    max_detail_items: 10
    selectors:
      item: 'ul[class*="PublicationList"] li'
      link: 'a[href^="/news/"]'
      title: 'span[class*="__title"]'
      date: 'time'
    detail_selectors:
      content: 'div[class*="Body-module"][class*="__body"]'
      date: 'article time'

  # Previous subscriptions retained for compatibility; live checks returned
